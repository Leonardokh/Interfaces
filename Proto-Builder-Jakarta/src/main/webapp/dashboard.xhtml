<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
    xmlns:p="primefaces" template="/WEB-INF/templates/template.xhtml">

    <ui:define name="content">

        <!-- Barra Móvil -->
        <div class="bg-dark text-white p-3 glass-panel container-fluid d-md-none d-block">
            <h:form id="formNavegacionMovil">
                <div class="row g-2" id="navPanelMovil">
                    <div class="col-6">
                        <p:commandButton value="Noticias" action="#{vistaBean.mostrarNoticias}" update=":contenido"
                            icon="pi pi-bell"
                            styleClass="btn btn-primary w-100" />
                    </div>

                    <div class="col-6">
                        <p:commandButton value="Nueva build" action="#{buildEditorBean.crearNueva}" update=":contenido"
                            icon="pi pi-plus"
                            styleClass="btn btn-primary w-100" />
                    </div>

                    <div class="col-6">
                        <p:commandButton value="Mis builds" action="#{vistaBean.mostrarMisBuilds}" update=":contenido"
                            icon="pi pi-folder"
                            styleClass="btn btn-primary w-100" />
                    </div>

                    <div class="col-6">
                        <p:commandButton value="Glosario" action="#{vistaBean.mostrarGlosario}" update=":contenido"
                            icon="pi pi-book"
                            styleClass="btn btn-primary w-100" />
                    </div>
                </div>
            </h:form>
        </div>

        <!-- fondo animado -->
        <div class="bg-slider">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="overlay"></div>

        <!-- Contenedor principal que ocupa toda la pantalla -->
        <div class="d-flex vh-100 vw-100 position-relative z-3 p-3">

            <!-- Menú lateral -->
            <div class="text-white p-3 glass-panel dashboard-sidebar col-md-4 col-lg-3 col-xl-2 me-3 d-none d-md-block">

                <h4>Panel de Navegación</h4>

                <h:form id="formNavegacion">
                    <div class="d-grid gap-3 mt-4">

                        <p:commandButton value="Noticias" action="#{vistaBean.mostrarNoticias}" update=":contenido"
                            icon="pi pi-bell"
                            styleClass="btn btn-primary w-100" />

                        <p:commandButton value="Nueva build" action="#{buildEditorBean.crearNueva}" update=":contenido"
                            icon="pi pi-plus"
                            styleClass="btn btn-primary w-100" />

                        <p:commandButton value="Mis builds" action="#{vistaBean.mostrarMisBuilds}" update=":contenido"
                            icon="pi pi-folder"
                            styleClass="btn btn-primary w-100" />

                        <p:commandButton value="Glosario" action="#{vistaBean.mostrarGlosario}" update=":contenido"
                            icon="pi pi-book"
                            styleClass="btn btn-primary w-100" />

                    </div>
                </h:form>
            </div>

            <!-- Panel derecho -->
            <div class="text-white p-4 glass-panel flex-grow-1" style="min-width: 0; overflow-y: auto;">

                <p:outputPanel id="contenido" layout="block">

                    <!-- Formulario compartido para crear y editar builds -->
                    <p:outputPanel rendered="#{vistaBean.seccion eq 'newBuild' or vistaBean.seccion eq 'editBuild'}">
                        <ui:include src="/views/buildForm.xhtml" />
                    </p:outputPanel>

                    <!-- Vista 2: Mis Builds -->
                    <p:outputPanel rendered="#{vistaBean.seccion eq 'myBuilds'}">
                        <ui:include src="/views/myBuilds.xhtml" />
                    </p:outputPanel>

                    <!-- Vista 3: Glosario -->
                    <p:outputPanel rendered="#{vistaBean.seccion eq 'glossary'}">
                        <ui:include src="/views/glossary.xhtml" />
                    </p:outputPanel>

                    <!-- Vista 4: Noticias -->
                    <p:outputPanel rendered="#{vistaBean.seccion eq 'news'}">
                        <ui:include src="/views/news.xhtml" />
                    </p:outputPanel>

                </p:outputPanel>

            </div>

        </div>


    </ui:define>
</ui:composition>
