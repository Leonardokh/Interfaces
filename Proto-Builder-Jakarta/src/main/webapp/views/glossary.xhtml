<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:h="jakarta.faces.html" 
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces" 
                xmlns:app="jakarta.faces.composite/components">

    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-white">Glosario Endfield</h2>
            <span class="badge bg-secondary">Base de Datos</span>
        </div>

        <!-- 1. Envolvemos el tabView en un h:form obligatorio -->
        <h:form id="glosarioForm">
            <p:tabView styleClass="custom-tabview" dynamic="false" cache="true">

                <!-- Pestaña 1: Operadores -->
                <p:tab title="Operadores">
                    <p:inputText value="#{glosarioBean.busquedaOperadores}"
                                 placeholder="Buscar operador por nombre"
                                 styleClass="form-control glossary-search mb-3">
                        <p:ajax event="keyup" delay="300" process="@this" update="operatorResults" />
                    </p:inputText>
                    <p:outputPanel id="operatorResults" layout="block">
                        <h:panelGroup layout="block" rendered="#{empty glosarioBean.operadoresFiltrados}"
                                      styleClass="text-white-50 mb-3">
                            No se encontraron operadores.
                        </h:panelGroup>
                        <div class="row g-3">
                            <ui:repeat value="#{glosarioBean.operadoresFiltrados}" var="operator">
                                <div class="col-12 col-sm-6 col-xl-4">
                                    <app:operatorCard value="#{operator}" />
                                </div>
                            </ui:repeat>
                        </div>
                    </p:outputPanel>
                </p:tab>

                <!-- Pestaña 2: Armas -->
                <p:tab title="Armas">
                    <p:inputText value="#{glosarioBean.busquedaArmas}"
                                 placeholder="Buscar arma por nombre"
                                 styleClass="form-control glossary-search mb-3">
                        <p:ajax event="keyup" delay="300" process="@this" update="weaponResults" />
                    </p:inputText>
                    <p:outputPanel id="weaponResults" layout="block">
                        <h:panelGroup layout="block" rendered="#{empty glosarioBean.armasFiltradas}"
                                      styleClass="text-white-50 mb-3">
                            No se encontraron armas.
                        </h:panelGroup>
                        <div class="row g-3">
                            <ui:repeat value="#{glosarioBean.armasFiltradas}" var="weapon">
                                <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
                                    <app:weaponCard value="#{weapon}" />
                                </div>
                            </ui:repeat>
                        </div>
                    </p:outputPanel>
                </p:tab>

                <!-- Pestaña 3: Artefactos -->
                <p:tab title="Equipamiento">
                    <p:inputText value="#{glosarioBean.busquedaGear}"
                                 placeholder="Buscar pieza por nombre"
                                 styleClass="form-control glossary-search mb-3">
                        <p:ajax event="keyup" delay="300" process="@this" update="gearResults" />
                    </p:inputText>
                    <p:outputPanel id="gearResults" layout="block">
                        <h:panelGroup layout="block" rendered="#{empty glosarioBean.gearFiltrado}"
                                      styleClass="text-white-50 mb-3">
                            No se encontraron piezas de equipamiento.
                        </h:panelGroup>
                        <div class="row g-3">
                            <ui:repeat value="#{glosarioBean.gearFiltrado}" var="gear">
                                <div class="col-12 col-sm-6 col-md-4 col-xl-3">
                                    <app:gearCard value="#{gear}" />
                                </div>
                            </ui:repeat>
                        </div>
                    </p:outputPanel>
                </p:tab>

            </p:tabView>
        </h:form>
    </div>

</ui:composition>
