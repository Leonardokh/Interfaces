<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
    xmlns:p="primefaces" xmlns:app="jakarta.faces.composite/components">

    <div class="container-fluid">

        <p:messages id="messages" showDetail="true" closable="true" />

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="text-white">Mis Builds Guardadas</h2>

            <span class="badge bg-secondary">
                Total: #{endfieldService.builds.size()} builds
            </span>

        </div>

        <div class="row g-4">

            <ui:repeat value="#{endfieldService.builds}" var="build">

                <div class="col-12 col-sm-6 col-xxl-4">

                    <app:buildCard value="#{build}" />

                </div>

            </ui:repeat>

        </div>

        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="400">
            <p:commandButton value="Cancelar" type="button"
                styleClass="ui-confirmdialog-no btn btn-outline-light" />
            <p:commandButton value="Eliminar" type="button"
                styleClass="ui-confirmdialog-yes btn btn-danger" />
        </p:confirmDialog>

    </div>

</ui:composition>
