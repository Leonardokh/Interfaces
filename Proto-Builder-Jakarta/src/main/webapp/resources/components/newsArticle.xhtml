<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:cc="jakarta.faces.composite"
                xmlns:p="primefaces">

    <cc:interface>
        <cc:attribute name="article" type="es.protobuilder.endfield.NewsArticle" required="true" />
        <cc:attribute name="backAction" method-signature="java.lang.String action()" required="true" />
    </cc:interface>

    <cc:implementation>
        <article class="card bg-dark text-white border-secondary overflow-hidden">
            <div class="news-image-frame news-article-image-frame bg-black d-flex align-items-center justify-content-center">
                <h:graphicImage library="img" name="#{cc.attrs.article.image}"
                                alt="#{cc.attrs.article.title}"
                                rendered="#{not empty cc.attrs.article.image}"
                                styleClass="news-image" />
                <h:panelGroup rendered="#{empty cc.attrs.article.image}">
                    <span class="text-muted small">Imagen no disponible</span>
                </h:panelGroup>
            </div>
            <div class="card-body p-3 p-md-4">
                <div>
                    <span class="badge bg-primary mb-2">#{cc.attrs.article.category}</span>
                    <h1 class="h2 text-accent">#{cc.attrs.article.title}</h1>
                    <p class="lead text-light">#{cc.attrs.article.summary}</p>
                    <p class="text-muted small mb-4">#{cc.attrs.article.author} · #{cc.attrs.article.publishedAt}</p>
                </div>
                <div class="news-article-content">
                    <ui:repeat value="#{cc.attrs.article.content}" var="paragraph">
                        <p class="text-light">#{paragraph}</p>
                    </ui:repeat>
                </div>
                <hr class="border-secondary my-4" />
                <div class="d-flex justify-content-end">
                    <p:commandButton value="Volver a noticias" icon="pi pi-arrow-left"
                                     action="#{cc.attrs.backAction}" process="@this" update=":contenido"
                                     styleClass="btn btn-outline-light" />
                </div>
            </div>
        </article>
    </cc:implementation>
</ui:composition>
