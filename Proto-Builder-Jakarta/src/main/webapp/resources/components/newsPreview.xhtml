<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:cc="jakarta.faces.composite"
                xmlns:p="primefaces">

    <cc:interface>
        <cc:attribute name="article" type="es.protobuilder.endfield.NewsArticle" required="true" />
    </cc:interface>

    <cc:implementation>
        <article class="card bg-dark text-white border-secondary h-100 overflow-hidden">
            <div class="news-image-frame bg-black d-flex align-items-center justify-content-center">
                <h:graphicImage library="img" name="#{cc.attrs.article.image}"
                                alt="#{cc.attrs.article.title}"
                                rendered="#{not empty cc.attrs.article.image}"
                                styleClass="news-image" />
                <h:panelGroup rendered="#{empty cc.attrs.article.image}">
                    <span class="text-muted small">Imagen no disponible</span>
                </h:panelGroup>
            </div>
            <div class="card-body d-flex flex-column">
                <div>
                    <span class="badge bg-primary mb-2">#{cc.attrs.article.category}</span>
                    <h3 class="h5 text-accent">#{cc.attrs.article.title}</h3>
                    <p class="text-light mb-3">#{cc.attrs.article.summary}</p>
                    <span class="text-muted small">#{cc.attrs.article.author} · #{cc.attrs.article.publishedAt}</span>
                </div>
                <p:commandButton value="Leer artículo" icon="pi pi-arrow-right" iconPos="right"
                                 action="#{newsBean.openArticle(cc.attrs.article.id)}"
                                 process="@this" update=":contenido"
                                 styleClass="btn btn-primary mt-3 align-self-start" />
            </div>
        </article>
    </cc:implementation>
</ui:composition>
