<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
                xmlns:f="jakarta.faces.core">

    <div class="container-fluid">
        <!-- Cabecera de la sección -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="text-white m-0">Nueva Build</h2>
                <span class="text-muted small">Configura los parámetros, operador y equipamiento de combate</span>
            </div>
            <span class="badge bg-primary">Modo Edición</span>
        </div>

        <h:form id="formNuevaBuild">
            <!-- Componente para mostrar mensajes de éxito o error al guardar -->
            <p:messages id="messages" showDetail="true" closable="true" />

            <div class="row g-4">

                <!-- Columna Izquierda: Datos Generales y Personaje -->
                <div class="col-lg-4">
                    <div class="p-4 rounded glass-panel h-100 d-flex flex-column gap-3">
                        <h5 class="text-warning border-bottom border-secondary pb-2">Información Básica</h5>

                        <!-- Nombre personalizado para la build -->
                        <div class="form-group">
                            <h:outputLabel for="nombreBuild" value="Nombre de la Build:" styleClass="form-label text-white small" />
                            <p:inputText id="nombreBuild"
                                         value="#{buildBean.nombreCustomBuild}"
                                         placeholder="Ej. Build DPS Crítico"
                                         styleClass="form-control bg-dark text-white border-secondary"
                                         required="true"
                                         requiredMessage="El nombre de la build es obligatorio" />
                        </div>

                        <!-- Selección Dinámica de Operador/Personaje extraído de la API -->
                        <div class="form-group">
                            <h:outputLabel for="operador" value="Operador / Personaje:" styleClass="form-label text-white small" />
                            <p:selectOneMenu id="operador"
                                             value="#{buildBean.personajeSeleccionadoId}"
                                             styleClass="form-control bg-dark text-white border-secondary w-100">
                                <f:selectItem itemLabel="Selecciona un operador importado..." itemValue="" />
                                <!-- Carga dinámicamente la lista de personajes obtenidos de Enka API -->
                                <f:selectItems value="#{buildBean.listaPersonajesDisponibles}"
                                               var="personaje"
                                               itemLabel="#{personaje.nombreMostrar}"
                                               itemValue="#{personaje.id}" />
                                <!-- Evento AJAX para actualizar la imagen y stats al cambiar de personaje -->
                                <p:ajax listener="#{buildBean.onPersonajeChange}" update="vistaPreviaImagen panelStats arma" />
                            </p:selectOneMenu>
                        </div>

                        <!-- Vista previa de imagen dinámica del personaje -->
                        <div class="mt-auto pt-3 text-center">
                            <h:panelGroup id="vistaPreviaImagen" layout="block" styleClass="bg-black bg-opacity-50 p-2 rounded border border-secondary d-flex align-items-center justify-content-center" style="height: 160px;">
                                <!-- Muestra la imagen si hay personaje seleccionado, o texto si no -->
                                <h:graphicImage value="#{buildBean.urlImagenPersonaje}"
                                                rendered="#{not empty buildBean.urlImagenPersonaje}"
                                                style="max-height: 100%; max-width: 100%; object-fit: contain;" />
                                <h:outputText value="Vista previa del Operador"
                                              rendered="#{empty buildBean.urlImagenPersonaje}"
                                              styleClass="text-muted small" />
                            </h:panelGroup>
                        </div>
                    </div>
                </div>

                <!-- Columna Central: Equipamiento y Armas -->
                <div class="col-lg-4">
                    <div class="p-4 rounded glass-panel h-100 d-flex flex-column gap-3">
                        <h5 class="text-warning border-bottom border-secondary pb-2">Equipamiento</h5>

                        <!-- Selección Dinámica de Arma -->
                        <div class="form-group">
                            <h:outputLabel for="arma" value="Arma / W-Engine:" styleClass="form-label text-white small" />
                            <p:selectOneMenu id="arma"
                                             value="#{buildBean.armaSeleccionadaId}"
                                             styleClass="form-control bg-dark text-white border-secondary w-100">
                                <f:selectItem itemLabel="Selecciona un arma..." itemValue="" />
                                <f:selectItems value="#{buildBean.listaArmasDisponibles}"
                                               var="arma"
                                               itemLabel="#{arma.nombre}"
                                               itemValue="#{arma.id}" />
                            </p:selectOneMenu>
                        </div>

                        <!-- Notas de estrategia -->
                        <div class="form-group mt-auto">
                            <h:outputLabel for="notas" value="Notas de rotación:" styleClass="form-label text-white small" />
                            <p:inputTextarea id="notas"
                                             value="#{buildBean.notasEstrategia}"
                                             rows="3"
                                             placeholder="Describe la estrategia o sinergias..."
                                             styleClass="form-control bg-dark text-white border-secondary" />
                        </div>
                    </div>
                </div>

                <!-- Columna Derecha: Estadísticas Obtenidas de la API -->
                <div class="col-lg-4">
                    <div class="p-4 rounded glass-panel h-100 d-flex flex-column justify-content-between">
                        <h:panelGroup id="panelStats" layout="block">
                            <h5 class="text-warning border-bottom border-secondary pb-2 mb-3">Estadísticas Importadas</h5>

                            <!-- Muestra los stats reales procesados del personaje desde el JSON -->
                            <div class="d-flex justify-content-between text-white mb-2 small">
                                <span>Ataque:</span>
                                <h:outputText value="#{buildBean.statAtaque}" styleClass="text-info fw-bold" />
                            </div>
                            <div class="d-flex justify-content-between text-white mb-2 small">
                                <span>Prob. Crítica:</span>
                                <h:outputText value="#{buildBean.statProbCritica}%" styleClass="text-info fw-bold" />
                            </div>
                            <div class="d-flex justify-content-between text-white mb-2 small">
                                <span>Daño Crítico:</span>
                                <h:outputText value="#{buildBean.statDanoCritico}%" styleClass="text-info fw-bold" />
                            </div>
                            <div class="d-flex justify-content-between text-white mb-2 small">
                                <span>Impacto / Anomalía:</span>
                                <h:outputText value="#{buildBean.statEspecial}" styleClass="text-info fw-bold" />
                            </div>
                        </h:panelGroup>

                        <div class="alert alert-secondary bg-dark text-muted border-secondary small mt-3 mb-0">
                            Los valores son extraídos directamente de tu vitrina en Enka.Network.
                        </div>
                    </div>
                </div>

            </div>

            <!-- Botones de Acción Inferiores -->
            <div class="row mt-4">
                <div class="col-12 d-flex justify-content-end gap-2">
                    <p:commandButton value="Limpiar Campos" type="reset" styleClass="btn btn-outline-light px-4" />
                    <!-- Llama al método del Bean para persistir la build en BD -->
                    <p:commandButton value="Guardar Build"
                                     action="#{buildBean.guardarBuild}"
                                     update="formNuevaBuild"
                                     styleClass="btn btn-primary px-4" />
                </div>
            </div>
        </h:form>
    </div>

</ui:composition>
