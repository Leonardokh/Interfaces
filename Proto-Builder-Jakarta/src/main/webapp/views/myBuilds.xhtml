<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
    xmlns:app="jakarta.faces.composite/components">

    <div class="container-fluid">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="text-white">Mis Builds Guardadas</h2>

            <span class="badge bg-secondary">
                Total: #{endfieldService.builds.size()} builds
            </span>

        </div>

        <h:form id="myBuildsForm">

            <div class="row g-4">

                <ui:repeat value="#{endfieldService.builds}" var="build">

                    <div class="col-12 col-md-6 col-xl-4">

                        <app:buildCard value="#{build}" />

                    </div>

                </ui:repeat>

            </div>

        </h:form>

    </div>

</ui:composition>
