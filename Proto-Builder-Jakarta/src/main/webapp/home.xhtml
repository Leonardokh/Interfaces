<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
    xmlns:p="primefaces" template="/WEB-INF/templates/template.xhtml">

    <ui:define name="title">
        Inicio
    </ui:define>

    <ui:define name="content">


        <!-- Fondos -->
        <div class="bg-slider">
            <div></div>
            <div></div>
            <div></div>
        </div>

        <div class="container">
            <div class="row">
                <div class="col-md-6 offset-md-3">
                    <h:form id="login">
                        <p:panel header="Iniciar sesión" id="login-panel" styleClass="panel-transparente">
                            <div class="ui-fluid flex flex-column align-items-center gap-3">

                                <div class="w-full" style="max-width: 300px;">
                                    <p:outputLabel for="username" value="Usuario:" styleClass="block mb-2" />
                                    <p:inputText id="username" value="#{loginBean.username}" />
                                </div>

                                <div class="w-full" style="max-width: 300px;">
                                    <p:outputLabel for="password" value="Contraseña:" styleClass="block mb-2" />
                                    <p:password id="password" value="#{loginBean.password}" />
                                </div>

                                <div class="w-full" style="max-width: 300px;">
                                    <p:commandButton value="Login" action="#{loginBean.login}" update="@form :mensajes"
                                        styleClass="w-full mt-2" />
                                </div>

                            </div>
                        </p:panel>
                    </h:form>
                </div>
            </div>
        </div>

    </ui:define>

</ui:composition>
