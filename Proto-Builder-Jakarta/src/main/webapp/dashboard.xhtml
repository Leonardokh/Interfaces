<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
    xmlns:p="primefaces" template="/WEB-INF/templates/template.xhtml">

    <ui:define name="content">

        <div class="bg-dark text-white p-3 glass-panel container-fluid d-md-none d-block">
            <ul class="nav" id="navPanelMovil">
                <div class="d-flex gap-3 w-100">
                    <a class="btn btn-primary col-3" href="">
                        Nueva build
                    </a>
                    <a class="btn btn-primary col-3" href="">
                        Mis builds
                    </a>
                    <a class="btn btn-primary col-3" href="">
                        Glosario
                    </a>
                </div>
            </ul>
        </div>

        <!-- fondo animado -->
        <div class="bg-slider">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="overlay"></div>

        <!-- Contenedor principal que ocupa toda la pantalla -->
        <div class="d-flex vh-100 vw-100 position-relative z-3 p-3">

            <!-- Menú lateral -->
            <!-- Menú lateral -->
            <div class="bg-dark text-white p-3 glass-panel col-2 me-3 d-none d-md-block">

                <h4>Panel de Navegación</h4>

                <h:form id="formNavegacion">
                    <div class="d-grid gap-3 mt-4">

                        <p:commandButton value="Probar perfil" action="#{usuarioBean.iniciarSesionPrueba}"
                            process="@this" update="@all" />

                        <p:commandButton value="Nueva build" action="#{buildView.mostrarNuevaBuild}" update=":contenido"
                            styleClass="btn btn-primary w-100" />

                        <p:commandButton value="Mis builds" action="#{buildView.mostrarMisBuilds}" update=":contenido"
                            styleClass="btn btn-primary w-100" />

                        <p:commandButton value="Glosario" action="#{buildView.mostrarGlosario}" update=":contenido"
                            styleClass="btn btn-primary w-100" />

                    </div>
                </h:form>
            </div>

            <!-- Panel derecho -->
            <div class="bg-dark text-white p-4 glass-panel flex-grow-1" style="min-width: 0; overflow-y: auto;">

                <p:outputPanel id="contenido" layout="block">

                    <ui:include src="#{buildView.vistaActual}" />

                </p:outputPanel>

            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    </ui:define>
</ui:composition>
