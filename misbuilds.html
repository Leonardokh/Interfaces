<!doctype html>
<html lang="en">
  <head>
    <title>Mis Builds</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" type="text/css" href="index.css" />
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  </head>
  <body>
      <!-- fondo animado -->
    <div class="bg-slider">
        <div></div><div></div><div></div>
    </div>
    <div class="overlay"></div>

    <!-- Contenedor principal que ocupa toda la pantalla -->
    <div class="d-flex vh-100 vw-100 position-relative z-3 p-3">
        <!-- Panel de navegación lateral -->
        <div class="bg-dark text-white p-3, glass-panel p-4">
            <h4>Panel de Navegación</h4>
            <ul class="nav flex-column" uid="navPanel">
                <li class="nav-item"><a href="#" class="nav-link text-white">Nueva Build</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white">Mis Builds</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white">Glosario</a></li>
            </ul>
        </div>

        <!-- Panel de contenido principal -->
    <div class="glass-panel flex-grow-1 p-4 rounded-4 overflow-auto">
            
            <!-- Sección 1 -->
            <div id="seccion1" class="contenido-seccion">
                <h2 class="text-white border-bottom pb-2">Gestión de Personajes</h2>
               <div class="row mt-4">
                    <div class="col-md-4"><div class="bg-light bg-opacity-25 p-4 rounded-3 text-white text-center"></div></div>
                    <div class="col-md-4"><div class="bg-light bg-opacity-25 p-4 rounded-3 text-white text-center"></div></div>
                    <div class="col-md-4"><div class="bg-light bg-opacity-25 p-4 rounded-3 text-white text-center"></div></div>
                </div>
            </div>

            <!-- Sección 2 Armas-->
            <div id="seccion2" class="contenido-seccion mt-4">
                <h2 class="text-white border-bottom pb-2">Gestión de Armas</h2>
                <div class="row mt-4">
                    <div class="col-md-4"><div class="bg-light bg-opacity-25 p-4 rounded-3 text-white text-center"></div></div>
                    <div class="col-md-4"><div class="bg-light bg-opacity-25 p-4 rounded-3 text-white text-center"></div></div>
                    <div class="col-md-4"><div class="bg-light bg-opacity-25 p-4 rounded-3 text-white text-center"></div></div>
                </div>
            </div>
            <!-- Sección 3 artefactos-->
            <div id="seccion3" class="contenido-seccion mt-4">
                <h2 class="text-white border-bottom pb-2">Gestión de Artefactos</h2>
                <div class="row mt-4">
                    <div class="col-6"><div class="bg-light bg-opacity-25 p-4 rounded-3 text-white text-center"></div></div>
                    <div class="col-6"><div class="bg-light bg-opacity-25 p-4 rounded-3 text-white text-center"></div></div>
                    <div class="col-6"><div class="bg-light bg-opacity-25 p-4 rounded-3 text-white text-center"></div></div>
                </div>
        </div>

    </div>




      
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
  </body>
</html>
