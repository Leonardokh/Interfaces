<!doctype html>
<html lang="en">
  <head>
    <title>Panel Principal</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" type="text/css" href="index.css" />
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  </head>
  <body>
      <!-- fondo animado -->
    <div class="bg-slider">
        <div></div><div></div><div></div>
    </div>
    <div class="overlay"></div>

    <!-- Contenedor principal que ocupa toda la pantalla -->
    <div class="d-flex vh-100 vw-100 position-relative z-3 p-3">
        <!-- Panel de navegación lateral -->
        <div class="bg-dark text-white p-3, glass-panel p-4">
            <h4>Panel de Navegación</h4>
            <ul class="nav flex-column" uid="navPanel">
                <li class="nav-item"><a href="#" class="nav-link text-white">Nueva Build</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white">Mis Builds</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white">Glosario</a></li>
            </ul>
        </div>

        <!-- Contenido principal -->
        <div class="flex-grow-1 p-3">
            <h1>Bienvenido al Panel Principal</h1>
            <p>Este es el contenido principal de la aplicación.</p>
        </div>




      
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
  </body>
</html>
