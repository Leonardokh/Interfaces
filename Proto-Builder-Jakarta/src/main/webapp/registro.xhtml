<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/templates/template.xhtml">

    <ui:define name="title">
        Registro de Usuario
    </ui:define>

    <ui:define name="content">
        <div class="bg-slider">
            <div></div>
            <div></div>
            <div></div>
        </div>

        <section class="auth-page">
            <h:form id="formRegistro" styleClass="auth-form auth-form-wide">
                <p:panel header="Crear cuenta" styleClass="auth-panel">
                    <p:messages id="msgRegistro" showDetail="true" closable="true" />

                    <div class="d-flex flex-column gap-3">
                        <div>
                            <p:outputLabel for="username" value="Nombre de usuario" styleClass="form-label" />
                            <p:inputText id="username"
                                         value="#{registroBean.username}"
                                         required="true"
                                         requiredMessage="El nombre de usuario es obligatorio."
                                         styleClass="w-100" />
                        </div>

                        <div>
                            <p:outputLabel for="email" value="Correo electrónico" styleClass="form-label" />
                            <p:inputText id="email"
                                         value="#{registroBean.email}"
                                         required="true"
                                         requiredMessage="El correo electrónico es obligatorio."
                                         validatorMessage="El formato del correo electrónico no es válido."
                                         styleClass="w-100">
                                <f:validateRegex pattern="^[\w.-]+@([\w-]+\.)+[\w-]{2,4}$" />
                            </p:inputText>
                        </div>

                        <div>
                            <p:outputLabel for="password" value="Contraseña" styleClass="form-label" />
                            <p:password id="password"
                                        value="#{registroBean.password}"
                                        required="true"
                                        requiredMessage="La contraseña es obligatoria."
                                        feedback="true"
                                        promptLabel="Ingresa una contraseña"
                                        weakLabel="Débil"
                                        goodLabel="Media"
                                        strongLabel="Fuerte"
                                        styleClass="w-100" />
                        </div>

                        <div>
                            <p:outputLabel for="confirmPassword" value="Confirmar contraseña" styleClass="form-label" />
                            <p:password id="confirmPassword"
                                        value="#{registroBean.confirmPassword}"
                                        required="true"
                                        requiredMessage="Debes confirmar tu contraseña."
                                        styleClass="w-100" />
                        </div>

                        <div class="d-flex flex-column flex-sm-row gap-2 pt-2">
                            <p:commandButton value="Crear cuenta"
                                             action="#{registroBean.registrarUsuario}"
                                             update="@form"
                                             icon="pi pi-user-plus"
                                             styleClass="flex-fill" />
                            <p:commandButton value="Volver"
                                             action="#{registroBean.Volver}"
                                             immediate="true"
                                             process="@this"
                                             styleClass="ui-button-secondary flex-fill" />
                        </div>
                    </div>
                </p:panel>
            </h:form>
        </section>
    </ui:define>
</ui:composition>
