<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:h="jakarta.faces.html" 
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces" 
                xmlns:app="jakarta.faces.composite/components">

    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-white">Glosario Endfield</h2>
            <span class="badge bg-secondary">Base de Datos</span>
        </div>

        <!-- 1. Envolvemos el tabView en un h:form obligatorio -->
        <h:form id="glosarioForm">
            <p:tabView styleClass="custom-tabview" dynamic="false" cache="true">

                <!-- Pestaña 1: Operadores -->
                <p:tab title="Operadores">
                    <div class="row g-3">
                        <ui:repeat value="#{endfieldService.operators}" var="operator">
                            <div class="col-md-4">
                                <app:operatorCard value="#{operator}" />
                            </div>
                        </ui:repeat>
                    </div>
                </p:tab>

                <!-- Pestaña 2: Armas -->
                <p:tab title="Armas y Equipamiento">
                    <div class="row g-3">
                        <ui:repeat value="#{endfieldService.weapons}" var="weapon">
                            <div class="col-md-4">
                                <app:weaponCard value="#{weapon}" />
                            </div>
                        </ui:repeat>
                    </div>
                </p:tab>

                <!-- Pestaña 3: Artefactos -->
                <p:tab title="Artefactos / Módulos">
                    <div class="row g-3">
                        <ui:repeat value="#{endfieldService.artifacts}" var="artifact">
                            <div class="col-md-4">
                                <app:artifactCard value="#{artifact}" />
                            </div>
                        </ui:repeat>
                    </div>
                </p:tab>

            </p:tabView>
        </h:form>
    </div>

</ui:composition>
