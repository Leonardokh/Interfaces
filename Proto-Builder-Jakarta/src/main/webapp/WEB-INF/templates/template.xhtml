<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets" xmlns:p="primefaces">

<h:head>
    <!-- 1. Primero Bootstrap desde el CDN (HTML puro) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- 2. Después tu CSS personalizado (Jakarta Faces) -->
    <h:outputStylesheet library="css" name="styles.css" />
</h:head>

<h:body>
    <header>


        <nav class="navbar position-relative" style="z-index: 1050;">
            <div class="container-fluid">

                <img src="#{resource['img:ProtoBuildLogo.png']}" alt="Logo" style="width: 60px; height: auto;" />

                <!-- Usuario con sesión iniciada -->
                <h:panelGroup rendered="#{usuarioBean.autenticado}">
                    <div class="dropdown">
                        <a href="#"
                           role="button"
                           class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
                           id="dropdownUser"
                           data-bs-toggle="dropdown"
                           aria-expanded="false"
                           style="cursor: pointer;">

                            <!-- Avatar -->
                            <img src="#{resource['img:avatar-default.jpg']}"
                                 alt="Avatar"
                                 class="profile-avatar me-2" />

                            <!-- Nombre tomado directamente de usuarioBean -->
                            <span class="fw-bold">
                    #{usuarioBean.nombre}
                </span>
                        </a>

                        <!-- Menú acoplable / desplegable -->
                        <ul class="dropdown-menu dropdown-menu-dark shadow mt-2" aria-labelledby="dropdownUser">
                            <li><hr class="dropdown-divider" /></li>
                            <li class="px-3 py-1">
                                <h:form id="formCerrarSesion">
                                    <p:commandButton value="Cerrar Sesión"
                                                     action="#{usuarioBean.cerrarSesion}"
                                                     styleClass="btn btn-danger w-100 btn-sm"
                                                     process="@this" />
                                </h:form>
                            </li>
                        </ul>
                    </div>
                </h:panelGroup>


                <!-- Visitante sin sesión -->
                <h:panelGroup rendered="#{not usuarioBean.autenticado}" styleClass="ms-auto">


                    <span class="navbar-brand text-white mb-0">
                        PROTO BUILDER
                    </span>

                </h:panelGroup>

            </div>
        </nav>


    </header>


    <!-- CONTENIDO DE CADA PÁGINA -->
    <main>
        <ui:insert name="content">
            Contenido
        </ui:insert>
    </main>


    <!-- FOOTER -->
    <footer>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


</h:body>

</html>
