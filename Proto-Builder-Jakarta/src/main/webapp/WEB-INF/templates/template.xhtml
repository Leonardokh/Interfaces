<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui">

<h:head>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <h:outputStylesheet library="css" name="styles.css" />

</h:head>

<h:body>

    <p:growl id="mensajes" showDetail="true" life="60000" />

    <!-- HEADER -->
    <header>
        <nav class="navbar app-navbar">
            <div class="container-fluid">
                <h:graphicImage library="images" name="ProtoBuildLogo.png" styleClass="navbar-brand" id="Logo" />
                <p:menubar styleClass="app-menubar">
                    <p:menuitem value="Inicio" outcome="/home" icon="pi pi-home" />
                    <p:menuitem value="Usuarios" outcome="/usuarios" icon="pi pi-users" />
                </p:menubar>
            </div>
        </nav>

    </header>




    <!-- CONTENIDO DE CADA PÁGINA -->
    <main>
        <ui:insert name="content">
            Contenido
        </ui:insert>
    </main>


    <!-- FOOTER -->
    <footer>
        <hr />
        <p>
            Aplicación de pruebas - FEMPA
        </p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


</h:body>

</html>
