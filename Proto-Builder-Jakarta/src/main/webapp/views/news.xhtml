<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
                xmlns:app="jakarta.faces.composite/components">

    <h:form id="formNoticias">
        <p:messages id="messages" showDetail="true" closable="true" />

        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="text-white mb-1">Noticias de Endfield</h2>
                    <span class="text-white small">Novedades y reportes de Talos-II</span>
                </div>
                <span class="badge bg-info text-dark">#{newsBean.newsService.articles.size()} noticias</span>
            </div>

            <ui:fragment rendered="#{not newsBean.showingArticle}">
                <div class="row g-4">
                    <ui:repeat value="#{newsBean.newsService.articles}" var="article">
                        <div class="col-12 col-lg-6">
                            <app:newsPreview article="#{article}" />
                        </div>
                    </ui:repeat>
                </div>
            </ui:fragment>

            <ui:fragment rendered="#{newsBean.showingArticle}">
                <ui:fragment rendered="#{not empty newsBean.selectedArticle}">
                    <app:newsArticle article="#{newsBean.selectedArticle}"
                                     backAction="#{newsBean.showList}" />
                </ui:fragment>
            </ui:fragment>
        </div>
    </h:form>

</ui:composition>
